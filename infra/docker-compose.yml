# Local development services. Ports are published on 127.0.0.1 only.
# The credentials below are for local development; production uses its own.
name: zagoat

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zagoat
      POSTGRES_PASSWORD: zagoat
      POSTGRES_DB: zagoat
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zagoat -d zagoat"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
