[project]
name = "zagoat-api"
version = "0.1.0"
description = "zagoat.io JSON API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.158.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.72.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
